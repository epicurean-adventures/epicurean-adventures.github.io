<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="Our houseplant collection: who they are, how to keep them happy, and how they grow over time." />
        <meta name="author" content="Spencer and Yunyi" />
        <title>Our Plants - Epicurean Adventures</title>
        <link href="css/styles.css" rel="stylesheet" />
        <link href="css/custom.css" rel="stylesheet" />
        <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
    </head>
    <body class="sb-nav-fixed">
        <!-- Navbar Placeholder -->
        <div id="navbar-placeholder"></div>

        <div id="layoutSidenav">
            <!-- Sidebar Placeholder -->
            <div id="sidebar-placeholder"></div>

            <!-- Main Content Area -->
            <div id="layoutSidenav_content">
                <main>
                    <div class="container-fluid px-4">
                        <h1 class="mt-4" data-i18n="plants.title">Our Plants</h1>
                        <p data-i18n="plants.intro">
                            The indoor (and porch) jungle. Every plant gets a photo timeline so we can
                            watch it grow &mdash; click any card for its full story and care needs.
                        </p>

                        <!-- Filter / search controls -->
                        <div class="d-flex flex-wrap align-items-center gap-2 mb-3">
                            <div class="input-group plants-search">
                                <span class="input-group-text"><i class="fas fa-search"></i></span>
                                <input type="text" id="plant-search" class="form-control" placeholder="Search plants..." data-i18n-placeholder="plants.search" aria-label="Search plants" />
                            </div>
                            <div id="plant-filters" class="btn-group flex-wrap" role="group" aria-label="Plant filters">
                                <button type="button" class="btn btn-outline-success btn-sm active" data-filter="all" data-i18n="plants.f.all">All</button>
                                <button type="button" class="btn btn-outline-success btn-sm" data-filter="cat-safe"><i class="fas fa-cat me-1"></i><span data-i18n="plants.f.catsafe">Cat-safe</span></button>
                                <button type="button" class="btn btn-outline-success btn-sm" data-filter="succulent" data-i18n="plants.f.succulent">Succulents &amp; cacti</button>
                                <button type="button" class="btn btn-outline-success btn-sm" data-filter="foliage" data-i18n="plants.f.foliage">Foliage</button>
                                <button type="button" class="btn btn-outline-success btn-sm" data-filter="flowering" data-i18n="plants.f.flowering">Flowering</button>
                                <button type="button" class="btn btn-outline-success btn-sm" data-filter="herb" data-i18n="plants.f.herb">Herbs &amp; edibles</button>
                                <button type="button" class="btn btn-outline-success btn-sm" data-filter="hanging" data-i18n="plants.f.hanging">Hanging</button>
                                <button type="button" class="btn btn-outline-success btn-sm" data-filter="mystery" data-i18n="plants.f.mystery">Mysteries</button>
                            </div>
                            <span id="plant-count" class="text-muted ms-auto small"></span>
                        </div>

                        <div id="loading-message" class="text-center my-5">
                            <div class="spinner-border text-success" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                            <p class="mt-2" data-i18n="plants.loading">Loading the jungle...</p>
                        </div>
                        <div id="error-message" class="alert alert-danger d-none" role="alert">
                            <i class="fas fa-exclamation-triangle me-2"></i>
                            <span id="error-text"></span>
                        </div>

                        <!-- Plant cards -->
                        <div id="plants-grid" class="plants-grid mb-5"></div>
                    </div>
                </main>
                <!-- Footer Placeholder -->
                <div id="footer-placeholder"></div>
            </div>
        </div>

        <!-- Plant detail modal -->
        <div class="modal fade" id="plant-modal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
                <div class="modal-content">
                    <div class="modal-header">
                        <div>
                            <h5 class="modal-title" id="plant-modal-title"></h5>
                            <div class="scientific-name" id="plant-modal-sci"></div>
                        </div>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body" id="plant-modal-body"></div>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
        <script src="js/i18n.js"></script>
        <script src="js/search.js"></script>
        <script src="js/includes.js"></script>
        <script src="js/plants.js"></script>
    </body>
</html>
