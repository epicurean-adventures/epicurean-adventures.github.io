<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="Peaches: the permanent collection. A gallery devoted to one very good calico." />
        <meta name="author" content="Spencer and Yunyi" />
        <title>Peaches - Epicurean Adventures</title>
        <link href="css/styles.css" rel="stylesheet" />
        <link href="css/custom.css" rel="stylesheet" />
        <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
    </head>
    <body class="sb-nav-fixed">
        <!-- Navbar Placeholder -->
        <div id="navbar-placeholder"></div>

        <div id="layoutSidenav">
            <!-- Sidebar Placeholder -->
            <div id="sidebar-placeholder"></div>

            <!-- Main Content Area -->
            <div id="layoutSidenav_content">
                <main>
                    <div class="container-fluid px-4">
                        <h1 class="mt-4 peaches-title">Peaches</h1>
                        <p class="peaches-subtitle" data-i18n="peaches.subtitle">The Permanent Collection &mdash; works devoted to one very good calico.</p>

                        <!-- The gallery wall -->
                        <div class="gallery-wall">

                            <!-- Centerpiece -->
                            <div class="wall-row">
                                <figure class="framed frame-rococo" style="width: min(88vw, 560px)">
                                    <img class="framed-photo" src="projects/images/peaches/window-lounge_2026-08-02.jpg" alt="Peaches asleep in her window hammock, front paws stretched over the edge" />
                                    <img class="framed-frame" src="projects/images/peaches/_frames/rococo.webp" alt="" />
                                    <figcaption class="placard">
                                        <span class="placard-title" data-i18n="peaches.p1.title">Repose with Paws Extended</span>
                                        <span class="placard-meta" data-i18n="peaches.p1.meta">2026 &middot; Digital photograph</span>
                                    </figcaption>
                                </figure>
                            </div>

                            <!-- Salon row -->
                            <div class="wall-row">
                                <figure class="framed frame-floral" style="width: min(42vw, 250px)">
                                    <img class="framed-photo" src="projects/images/peaches/curtain-watch_2026-08-15.jpg" alt="Peaches sitting by the curtain" />
                                    <img class="framed-frame" src="projects/images/peaches/_frames/floral-arch.webp" alt="" />
                                    <figcaption class="placard">
                                        <span class="placard-title" data-i18n="peaches.p2.title">Vigil at the Curtain</span>
                                        <span class="placard-meta" data-i18n="peaches.p2.meta">2026 &middot; Digital photograph</span>
                                    </figcaption>
                                </figure>

                                <figure class="framed frame-gilded" style="width: min(55vw, 330px)">
                                    <img class="framed-photo" src="projects/images/peaches/sofa-drape_2026-08-17.jpg" alt="Peaches draped over the arm of the sofa" />
                                    <img class="framed-frame" src="projects/images/peaches/_frames/gilded.webp" alt="" />
                                    <figcaption class="placard">
                                        <span class="placard-title" data-i18n="peaches.p3.title">Odalisque on the Sofa Arm</span>
                                        <span class="placard-meta" data-i18n="peaches.p3.meta">2026 &middot; Digital photograph</span>
                                    </figcaption>
                                </figure>

                                <!-- Miniatures -->
                                <div class="miniature-stack">
                                    <figure class="framed frame-rococo" style="width: min(40vw, 235px)">
                                        <img class="framed-photo" src="projects/images/peaches/treat-time_2026-07-29.jpg" alt="Peaches receiving a lickable treat" />
                                        <img class="framed-frame" src="projects/images/peaches/_frames/rococo.webp" alt="" />
                                        <figcaption class="placard">
                                            <span class="placard-title" data-i18n="peaches.p4.title">Tribute, Being Received</span>
                                            <span class="placard-meta" data-i18n="peaches.p4.meta">2026 &middot; Digital photograph</span>
                                        </figcaption>
                                    </figure>
                                    <figure class="framed frame-gilded" style="width: min(32vw, 185px)">
                                        <img class="framed-photo" src="projects/images/peaches/toe-beans_2026-08-15.jpg" alt="Peaches asleep with toe beans on display" />
                                        <img class="framed-frame" src="projects/images/peaches/_frames/gilded.webp" alt="" />
                                        <figcaption class="placard">
                                            <span class="placard-title" data-i18n="peaches.p5.title">Toe Beans in Repose</span>
                                            <span class="placard-meta" data-i18n="peaches.p5.meta">2026 &middot; Digital photograph</span>
                                        </figcaption>
                                    </figure>
                                </div>
                            </div>

                            <!-- The artist's renditions -->
                            <div class="wall-divider" data-i18n="peaches.divider">In the Artist's Hand</div>
                            <div class="wall-row">
                                <figure class="framed frame-gilded" style="width: min(48vw, 300px)">
                                    <img class="framed-photo" src="projects/images/drawing/watercolor/cat-market-peaches-detail_2026-08-10.jpg" alt="Watercolor detail: Peaches selling fresh peaches at a market stand" />
                                    <img class="framed-frame" src="projects/images/peaches/_frames/gilded.webp" alt="" />
                                    <figcaption class="placard">
                                        <span class="placard-title" data-i18n="peaches.p6.title">Peaches, Selling Peaches</span>
                                        <span class="placard-meta" data-i18n-html="peaches.p6.meta">2026 &middot; Detail from <a href="projects.html#watercolors">Cat Market</a></span>
                                    </figcaption>
                                </figure>
                                <figure class="framed frame-gilded" style="width: min(48vw, 300px)">
                                    <img class="framed-photo" src="projects/images/drawing/watercolor/peaches-studies_2026-08-15.jpg" alt="Watercolor studies of Peaches, being inspected by Peaches" />
                                    <img class="framed-frame" src="projects/images/peaches/_frames/gilded.webp" alt="" />
                                    <figcaption class="placard">
                                        <span class="placard-title" data-i18n="peaches.p7.title">Studies of a Calico (with Critic)</span>
                                        <span class="placard-meta" data-i18n-html="peaches.p7.meta">2026 &middot; Watercolor &middot; <a href="projects.html#watercolors">see all art</a></span>
                                    </figcaption>
                                </figure>
                            </div>

                            <p class="wall-credits" data-i18n="peaches.credits">
                                Frames: Sailko (CC BY 3.0), Hubert Robert (PD), Samuel Stanesby (PD) &mdash; via Wikimedia Commons.
                            </p>
                        </div>
                    </div>
                </main>
                <!-- Footer Placeholder -->
                <div id="footer-placeholder"></div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
        <script src="js/i18n.js"></script>
        <script src="js/search.js"></script>
        <script src="js/includes.js"></script>
    </body>
</html>
